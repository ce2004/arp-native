name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The GitHub Windows runners already carry the MSVC toolchain that
      # NativeAOT needs to link, including the ARM64 cross tools, so no
      # local C++ install is required to produce either binary.
      - name: Publish (NativeAOT, self-contained)
        run: dotnet publish -r ${{ matrix.rid }} -c Release -o publish/${{ matrix.rid }}

      # Only the x64 build can execute on an x64 runner. The headless checks
      # cover config, the duration grammar, routing, the RF64 container and the
      # dialog templates. The device tests (--uitest, --captest, --signaltest)
      # need real audio endpoints and are run locally.
      # Two traps here, both because the app is a windowed (GUI subsystem) exe:
      #   1. PowerShell does not wait for a WinExe and never sets
      #      $LASTEXITCODE, so it must be launched with Start-Process -Wait
      #      -PassThru and the exit code read from the process object.
      #   2. Its console output does not reach the Actions log, so the
      #      transcript it writes to TEMP has to be printed explicitly.
      - name: Run self-test
        if: matrix.rid == 'win-x64'
        run: |
          $exe = ".\publish\${{ matrix.rid }}\ArpRecorder.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          $code = $p.ExitCode

          $report = Join-Path $env:TEMP 'arp_selftest_report.txt'
          if (Test-Path $report) {
            Write-Host "----- self-test transcript -----"
            Get-Content $report | Write-Host
            Write-Host "--------------------------------"
          } else {
            Write-Host "No transcript was produced at $report"
          }

          if ($code -ne 0) { throw "Self-test failed with exit code $code" }
          Write-Host "Self-test passed."

      - name: Report binary size
        run: |
          $exe = Get-Item "publish\${{ matrix.rid }}\ArpRecorder.exe"
          "${{ matrix.rid }}: {0:N2} MB" -f ($exe.Length / 1MB)

      # The whole application is one executable, so that is what ships: no
      # archive to unpack and nothing to place beside it. Debug symbols stay
      # behind; they are ~12 MB against a ~2.8 MB program and are not needed to
      # run it. The architecture is in the file name because the updater picks
      # its download by matching it.
      - name: Name the executable
        run: |
          Copy-Item "publish\${{ matrix.rid }}\ArpRecorder.exe" `
                    "ArpRecorder-${{ matrix.rid }}.exe"
          $f = Get-Item "ArpRecorder-${{ matrix.rid }}.exe"
          "Shipping {0} ({1:N2} MB)" -f $f.Name, ($f.Length / 1MB) | Write-Host

      - name: Generate SHA256 checksum
        run: |
          $h = (Get-FileHash "ArpRecorder-${{ matrix.rid }}.exe" -Algorithm SHA256).Hash
          "$h  ArpRecorder-${{ matrix.rid }}.exe" |
            Out-File -FilePath "sha256-${{ matrix.rid }}.txt" -Encoding utf8 -NoNewline

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: |
            ArpRecorder-${{ matrix.rid }}.exe
            sha256-${{ matrix.rid }}.txt

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem artifacts -Recurse -File | Move-Item -Destination dist
          # One checksum file covering both executables. The updater reads this
          # and refuses to install anything whose hash does not match.
          Get-ChildItem dist\sha256-*.txt |
            ForEach-Object { (Get-Content $_ -Raw).Trim() } |
            Out-File dist\sha256sums.txt -Encoding utf8
          Remove-Item dist\sha256-*.txt
          Get-ChildItem dist

      # The app reads these notes aloud through the screen reader, so the commit
      # message is used verbatim and must stay free of markdown "#" and "*".
      - name: Extract commit message for release notes
        run: git log -1 --pretty=%B | Out-File -FilePath release_notes.txt -Encoding utf8

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/ArpRecorder-win-arm64.exe
            dist/ArpRecorder-win-x64.exe
            dist/sha256sums.txt
          body_path: release_notes.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
